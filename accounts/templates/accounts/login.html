{% extends "base.html" %}
{% block title %}Kirish{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-4">Tizimga kirish</h3>
      {% if form.errors %}
        <div class="alert alert-danger">Login yoki parol noto'g'ri.</div>
      {% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Login</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Parol</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Kirish</button>
      </form>
      <p class="text-center mt-3 mb-0 small">Akkountingiz yo'qmi? <a href="{% url 'accounts:register' %}">Ro'yxatdan o'tish</a></p>
    </div>
  </div>
</div>
{% endblock %}
