<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishonchli Usta</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap">
    <style>
        *{ box-sizing:border-box; margin:0; padding:0; }
        html, body {
            height: 100%;
            background: radial-gradient(circle at 20% 20%, #14b8a6 0%, #0d9488 45%, #0f766e 100%);
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        /* Suzuvchi fon shakllari */
        .blob{ position:absolute; border-radius:50%; filter:blur(2px); opacity:.18; background:#fff; }
        .blob1{ width:220px; height:220px; top:-60px; left:-60px; animation: float1 9s ease-in-out infinite; }
        .blob2{ width:160px; height:160px; bottom:-40px; right:-40px; animation: float2 7s ease-in-out infinite; }
        .blob3{ width:110px; height:110px; top:20%; right:8%; animation: float1 11s ease-in-out infinite reverse; }
        .blob4{ width:90px; height:90px; bottom:15%; left:6%; animation: float2 8s ease-in-out infinite; }
        @keyframes float1{ 0%,100%{ transform:translateY(0) translateX(0); } 50%{ transform:translateY(30px) translateX(20px); } }
        @keyframes float2{ 0%,100%{ transform:translateY(0) translateX(0); } 50%{ transform:translateY(-25px) translateX(-15px); } }

        .splash-wrap { text-align: center; position: relative; z-index: 2; }

        .badge-ring{
            width:120px; height:120px; border-radius:50%;
            background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35);
            display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
            opacity:0; transform:scale(.4);
            animation: ringPop .7s cubic-bezier(.34,1.56,.64,1) forwards;
            box-shadow: 0 0 0 0 rgba(255,255,255,.4);
        }
        .badge-ring::before{
            content:""; position:absolute; width:120px; height:120px; border-radius:50%;
            border:2px solid rgba(255,255,255,.5); animation: pulseRing 2.2s ease-out .8s infinite;
        }
        @keyframes pulseRing{
            0%{ transform:scale(1); opacity:.7; }
            100%{ transform:scale(1.6); opacity:0; }
        }
        @keyframes ringPop{
            0%{ opacity:0; transform:scale(.4) rotate(-30deg); }
            60%{ opacity:1; transform:scale(1.12) rotate(8deg); }
            100%{ opacity:1; transform:scale(1) rotate(0); }
        }

        .logo-row { font-size: 3.2rem; line-height:1; }

        .brand {
            color: #fff; font-weight: 900; font-size: 2.1rem; letter-spacing: -.02em;
            margin-top: 20px; opacity: 0;
            animation: fadeUp .7s ease .55s forwards;
        }
        .tagline {
            color: #d1fae5; font-size: 1rem; margin-top: 8px; opacity: 0; font-weight:600;
            animation: fadeUp .7s ease .8s forwards;
        }

        .dots-row{ margin-top:30px; display:flex; gap:8px; justify-content:center; opacity:0; animation: fadeUp .7s ease 1.05s forwards; }
        .dot{ width:9px; height:9px; border-radius:50%; background:#fff; animation: bounce 1.2s infinite ease-in-out; }
        .dot:nth-child(2){ animation-delay:.15s; }
        .dot:nth-child(3){ animation-delay:.3s; }
        @keyframes bounce{
            0%, 80%, 100% { transform: scale(0.6); opacity: .5; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-out { animation: fadeOut .5s ease forwards; }
        @keyframes fadeOut { to { opacity: 0; transform:scale(.98); } }
    </style>
</head>
<body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>

    <div class="splash-wrap" id="splashWrap">
        <div class="badge-ring"><div class="logo-row">🛠️</div></div>
        <div class="brand">Ishonchli Usta</div>
        <div class="tagline">Yaqin atrofdagi eng ishonchli ustalar — bir joyda</div>
        <div class="dots-row">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
    </div>

    <script>
        setTimeout(function () {
            document.getElementById('splashWrap').classList.add('fade-out');
            setTimeout(function () {
                window.location.href = "{% url next_url_name %}";
            }, 450);
        }, 2400);
    </script>
</body>
</html>
