{% extends "base.html" %}
{% block title %}Hisobni o'chirish{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h5 class="mb-3 text-danger">⚠️ Hisobni butunlay o'chirish</h5>
      <p class="text-muted">Bu amalni ortga qaytarib bo'lmaydi. Barcha ma'lumotlaringiz (profil, postlar, e'lonlar, xabarlar) o'chiriladi.</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger w-100">Ha, hisobimni butunlay o'chirish</button>
        <a href="{% url 'accounts:dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">Bekor qilish</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
